{% extends "base.html" %}

{% block content %}

    {% csrf_token %}

    <a href="{{ object.get_absolute_url }}" class="btn btn-secondary mr-2">No</a>
    <input type="submit" value="Yes" class="btn btn-danger">
  </form>
{% endblock %}
